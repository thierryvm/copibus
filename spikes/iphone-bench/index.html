<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banc iPhone">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Banc iPhone</title>
<style>
  :root { color-scheme: dark; --bg:#0b1020; --card:#151b30; --text:#e8ecf8; --muted:#9aa3bd; --ok:#3ecf8e; --ko:#ff6b6b; --acc:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .t { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  .t h2 { font-size:17px; margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; }
  .t p { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .st { font-size:14px; font-weight:600; }
  .st.ok { color:var(--ok); } .st.ko { color:var(--ko); }
  button { -webkit-appearance:none; appearance:none; border:0; border-radius:10px; background:var(--acc); color:#0b1020;
           font:600 16px -apple-system, system-ui; padding:12px 14px; margin:0 8px 8px 0; min-height:44px; }
  button.sec { background:#2a3354; color:var(--text); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; color:var(--muted); margin:6px 0 0; }
</style>
</head>
<body>
<h1>Banc d'essai iPhone</h1>
<p class="sub" id="mode"></p>
<div id="tests"></div>
<div class="t">
  <h2>Rapport</h2>
  <p>Aucune position exacte ni donnée personnelle : seulement des résultats.</p>
  <button id="copy">Copier le rapport</button>
  <pre id="report"></pre>
</div>
<script src="app.js"></script>
</body>
</html>
